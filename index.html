<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11051f">
  <meta name="description" content="A little surprise from Raunak. Trust the world?">
  <meta property="og:title" content="MATTERS OF WORLD">
  <meta property="og:description" content="A little surprise for curious visitors.">
  <title>MATTERS OF WORLD — A Little Surprise</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #08030f;
      color: #fff;
      font-synthesis: none;
      text-rendering: optimizeLegibility;
      -webkit-font-smoothing: antialiased;
      --pink: #ff66dd;
      --cyan: #70eaff;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100svh;
      margin: 0;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      padding: 24px;
      text-align: center;
      background:
        radial-gradient(ellipse at 50% 43%, #32105b 0%, #170824 38%, #08030f 78%),
        #08030f;
    }

    .stars {
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: .55;
      background-image: radial-gradient(#fff 0.7px, transparent 0.9px), radial-gradient(#c997ff 0.8px, transparent 1px);
      background-position: 0 0, 31px 49px;
      background-size: 83px 83px, 127px 127px;
      mask-image: linear-gradient(transparent, #000 18%, #000 82%, transparent);
    }

    main {
      position: relative;
      width: min(100%, 850px);
      padding: clamp(32px, 7vw, 72px);
      border: 1px solid #ffffff35;
      border-radius: 28px;
      background: #ffffff0d;
      box-shadow: 0 0 90px #a600ff25, inset 0 0 35px #ffffff08;
      backdrop-filter: blur(12px);
    }

    .eyebrow {
      margin: 0 0 24px;
      color: #d9c2fa;
      font-size: .74rem;
      font-weight: 750;
      letter-spacing: .28em;
      text-transform: uppercase;
    }

    .intro {
      margin: 0 0 34px;
      font-size: clamp(1.8rem, 6vw, 3.7rem);
      font-weight: 850;
      letter-spacing: .035em;
      line-height: 1.12;
      text-transform: uppercase;
      background: linear-gradient(95deg, var(--pink), #fff 48%, var(--cyan));
      color: transparent;
      background-clip: text;
      -webkit-background-clip: text;
      text-shadow: 0 0 28px #ff40d433;
    }

    button {
      min-height: 54px;
      padding: 15px 42px;
      border: 0;
      border-radius: 999px;
      color: #16051e;
      background: linear-gradient(90deg, var(--pink), var(--cyan));
      font: inherit;
      font-size: 1rem;
      font-weight: 900;
      letter-spacing: .16em;
      cursor: pointer;
      box-shadow: 0 0 28px #ef55ff77;
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    button:hover { transform: translateY(-2px) scale(1.04); box-shadow: 0 0 44px #ef55ffbb; }
    button:focus-visible, a:focus-visible { outline: 3px solid white; outline-offset: 5px; }

    .hint { margin: 18px 0 0; color: #c7b6d8; font-size: .88rem; }

    .reveal {
      display: none;
      margin: 0;
      font-size: clamp(3.6rem, 16vw, 11rem);
      font-weight: 1000;
      line-height: .82;
      letter-spacing: -.08em;
      text-transform: uppercase;
      color: #fff;
      -webkit-text-stroke: 2px #ff5ce1;
      text-shadow: 5px 5px 0 #ff36c7, 10px 10px 0 #8b35ff, 0 0 25px #ff36c7, 0 0 65px #8b35ff;
      animation: pop 700ms cubic-bezier(.2, 1.8, .4, 1) both, wiggle 1.5s ease-in-out 700ms infinite alternate;
    }

    .video-wrap { display: none; margin-top: clamp(32px, 7vw, 58px); animation: fade-up 500ms ease both; }
    .card.revealed .intro, .card.revealed #revealButton, .card.revealed .hint, .card.revealed .eyebrow { display: none; }
    .card.revealed .reveal, .card.revealed .video-wrap { display: block; }
    .video-title { margin: 0 0 16px; color: #ead8ff; font-size: .95rem; font-weight: 650; letter-spacing: .04em; }

    .video-frame {
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      border: 1px solid #ffffff35;
      border-radius: 16px;
      background: #05030b;
      box-shadow: 0 12px 45px #0008;
    }

    .video-frame iframe { width: 100%; height: 100%; border: 0; }
    .fallback { margin: 14px 0 0; color: #c7b6d8; font-size: .85rem; }
    .fallback a { color: #a5edff; }

    footer { position: fixed; right: 18px; bottom: 14px; color: #ffffff73; font-size: .72rem; letter-spacing: .12em; }

    @keyframes pop {
      from { opacity: 0; transform: scale(.2) rotate(-12deg); }
      to { opacity: 1; transform: scale(1) rotate(0); }
    }
    @keyframes wiggle {
      from { transform: rotate(-2deg) scale(1); }
      to { transform: rotate(2deg) scale(1.04); }
    }
    @keyframes fade-up { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="stars" aria-hidden="true"></div>
  <main class="card" id="card" aria-live="polite">
    <p class="eyebrow">MATTERS OF WORLD</p>
    <p class="intro">If you trust the world,<br>click below</p>
    <button id="revealButton" type="button" aria-controls="surprise">CLICK</button>
    <p class="hint">A tiny button. What could possibly happen?</p>
    <section id="surprise" aria-label="The surprise" aria-hidden="true">
      <h1 class="reveal">FUCK<br>YOU</h1>
      <div class="video-wrap">
        <p class="video-title">Anyway, here's a song for you.</p>
        <div class="video-frame">
          <iframe
            id="rickroll"
            title="Never Gonna Give You Up music video"
            src="about:blank"
            allow="autoplay; encrypted-media; picture-in-picture; fullscreen"
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen>
          </iframe>
        </div>
        <p class="fallback">If playback doesn't start, <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank" rel="noopener noreferrer">play the video on YouTube</a>.</p>
      </div>
    </section>
  </main>
  <footer>MADE FOR THE CURIOUS</footer>
  <script>
    const card = document.getElementById("card");
    const surprise = document.getElementById("surprise");
    const player = document.getElementById("rickroll");

    document.getElementById("revealButton").addEventListener("click", () => {
      card.classList.add("revealed");
      surprise.setAttribute("aria-hidden", "false");
      player.src = "https://www.youtube-nocookie.com/embed/dQw4w9WgXcQ?autoplay=1&playsinline=1&rel=0";
    }, { once: true });
  </script>
</body>
</html>
